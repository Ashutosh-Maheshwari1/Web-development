<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lot System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            background-color: #f0f0f0;
            padding: 20px;
            text-align: center;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        section {
            background-color: #f7f7f7;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            text-align: center;
        }

        h1, h2 {
            color: #333;
        }

        #parking-lot-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #available-spots, #total-spots {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #vehicle-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #park-vehicle-btn {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #parking-history {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #parking-history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        #parking-history-list li {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        #parking-history-list li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Parking Lot System</h1>
    </header>
    <main>
        <section id="parking-lot-info">
            <h2>Parking Lot Information</h2>
            <p id="available-spots"></p>
            <p id="total-spots"></p>
        </section>
        <section id="vehicle-info">
            <h2>Vehicle Information</h2>
            <form id="vehicle-form">
                <label for="vehicle-type">Vehicle Type:</label>
                <select id="vehicle-type" name="vehicle-type">
                    <option value="car">Car</option>
                    <option value="truck">Truck</option>
                    <option value="motorcycle">Motorcycle</option>
                </select>
                <br>
                <label for="license-plate">License Plate:</label>
                <input type="text" id="license-plate" name="license-plate">
                <br>
                <button type="button" id="park-vehicle-btn">Park Vehicle</button>
            </form>
        </section>
        <section id="parking-history">
            <h2>Parking History</h2>
            <ul id="parking-history-list"></ul>
        </section>
    </main>

    <script>
        // Initialize parking lot data
        let parkingLot = {
            totalSpots: 100,
            availableSpots: 100,
            parkedVehicles: []
        };

        // Update parking lot info display
        function updateParkingLotInfo() {
            document.getElementById("available-spots").innerText = `Available Spots: ${parkingLot.availableSpots}`;
            document.getElementById("total-spots").innerText = `Total Spots: ${parkingLot.totalSpots}`;
        }

        // Handle park vehicle button click
        document.getElementById("park-vehicle-btn").addEventListener("click", () => {
            // Get vehicle type and license plate from form
            let vehicleType = document.getElementById("vehicle-type").value.trim();
            let licensePlate = document.getElementById("license-plate").value.trim();

            // Validate input fields
            if (!vehicleType || !licensePlate) {
                alert("Please enter both vehicle type and license plate.");
                return;
            }

            // Check if parking lot is full
            if (parkingLot.availableSpots === 0) {
                alert("Parking lot is full!");
                return;
            }

            // Check for duplicate license plate
            if (parkingLot.parkedVehicles.some(vehicle => vehicle.licensePlate === licensePlate)) {
                alert("This vehicle is already parked!");
                return;
            }

            // Park vehicle and update parking lot data
            parkingLot.parkedVehicles.push({ vehicleType, licensePlate });
            parkingLot.availableSpots--;

            // Update parking lot info display
            updateParkingLotInfo();

            // Add to parking history list
            let listItem = document.createElement("li");
            listItem.textContent = `Vehicle: ${vehicleType}, License: ${licensePlate}`;
            document.getElementById("parking-history-list").appendChild(listItem);

            // Clear form fields
            document.getElementById("vehicle-type").value = "car";
            document.getElementById("license-plate").value = "";
        });

        // Initialize display
        updateParkingLotInfo();
    </script>
</body>
</html>
